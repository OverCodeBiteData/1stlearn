<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Geopolitical Voting & LIGHTCOIN App</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; padding: 20px; }
        .container { max-width: 600px; background: white; padding: 20px; margin: auto; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        .question { margin: 20px 0; }
        .option { margin: 10px 0; }
        .option input[type="radio"] { margin-right: 10px; }
        .submit-btn { display: block; width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; margin-top: 20px; }
        .submit-btn:hover { background: #218838; }
        #reward { font-weight: bold; color: #28a745; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Geopolitical Questionnaire</h1>
        <p id="reward">Your Reward: 0 Coins</p>
        <div class="question">
            <p>Will there be a Russian invasion of Ukraine within the next year?</p>
            <div class="option">
                <input type="radio" name="vote" value="yes" id="yes"> <label for="yes">Yes</label>
            </div>
            <div class="option">
                <input type="radio" name="vote" value="no" id="no"> <label for="no">No</label>
            </div>
        </div>
        <button class="submit-btn" onclick="submitVote()">Submit Vote</button>
    </div>
    <script src="app.js"></script>
</body>
</html>
